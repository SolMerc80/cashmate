name: cashmate
description: "A local budget app built with Flutter."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # Core Local Storage & Database
  drift: ^2.18.0
  drift_flutter: ^0.1.0
  sqlite3_flutter_libs: ^0.5.21
  path_provider: ^2.1.6
  path: ^1.9.1

  # State Management & Architecture
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  
  # Data Modeling & Utilities
  freezed_annotation: ^2.4.1
  flutter_secure_storage: ^9.2.2  # Reverted to official stable ^9.2.2
  intl: ^0.20.3
  
  # UI & Charts
  fl_chart: ^0.68.0               # Reverted to stable ^0.68.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.11
  drift_dev: ^2.18.0
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  build_verify: ^3.1.0

flutter:
  uses-material-design: true